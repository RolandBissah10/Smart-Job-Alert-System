name: Run job alert pipeline

on:
  schedule:
    # Hourly. Adjust to taste - this is independent of any app config, it's
    # purely how often this workflow calls the backend.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend's pipeline endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.BACKEND_URL }}/jobs/run-pipeline" \
            -H "X-Pipeline-Secret: ${{ secrets.PIPELINE_SECRET }}"
