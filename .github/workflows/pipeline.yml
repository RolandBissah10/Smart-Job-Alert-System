name: Run job alert pipeline

on:
  schedule:
    # Hourly, offset to :17 rather than :00 - GitHub explicitly documents that
    # schedules firing at the top of the hour compete with everyone else's and
    # get delayed/dropped under load. Confirmed via the Actions API: this
    # workflow's runs were landing 2-6 hours apart instead of hourly before
    # this change.
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend's pipeline endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.BACKEND_URL }}/jobs/run-pipeline" \
            -H "X-Pipeline-Secret: ${{ secrets.PIPELINE_SECRET }}"
